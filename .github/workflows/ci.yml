name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # Checkout le code
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Installe les dépendances
      - name: Install dependencies
        run: npm ci

      # Lance le linting
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      # Build le projet
      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'test-key' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'test-secret' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/cashpilot' }}

      # Vérifie les types TypeScript
      - name: Check TypeScript types
        run: npx tsc --noEmit
        continue-on-error: true

